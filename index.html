<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9ECEA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Carnet de salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9ECEA; --surface:#F7F8F6; --ink:#1D2730; --muted:#5D6A74; --line:#CDD3D0;
  --blue:#2450C8; --red:#C8312F; --yellow:#D9A400; --green:#2E8B57; --field:#FFFFFF;
  --onblue:#FFFFFF;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161B20; --surface:#1F262D; --ink:#E8ECEA; --muted:#98A4AD; --line:#34404A;
    --blue:#6D8FF0; --red:#F06B67; --yellow:#E8BC2E; --green:#4FBF84; --field:#141A1F; --onblue:#0E1520;
  }
}
:root[data-theme="dark"]{
  --bg:#161B20; --surface:#1F262D; --ink:#E8ECEA; --muted:#98A4AD; --line:#34404A;
  --blue:#6D8FF0; --red:#F06B67; --yellow:#E8BC2E; --green:#4FBF84; --field:#141A1F; --onblue:#0E1520;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--cond);font-weight:700;font-size:34px;line-height:1.05;margin:4px 0 4px;letter-spacing:.2px}
h2{font-family:var(--cond);font-weight:600;font-size:22px;margin:24px 0 8px}
h3{font-family:var(--cond);font-weight:600;font-size:20px;margin:0}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--onblue)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding:0 8px}
.btn.wide{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
label.f{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field)}
textarea.i{min-height:72px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--green)} .dot.warn{background:var(--yellow)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--blue);font-weight:600}

/* exercise entry — the signature element */
.ex{border-left:6px solid var(--c,var(--blue))}
.ex .head{display:flex;align-items:flex-start;gap:8px}
.ex .bloc{font-size:13px;color:var(--muted)}
.last{font-size:14px;color:var(--muted);margin:6px 0 10px}
.line{display:grid;grid-template-columns:1fr auto 1fr auto 1.2fr 36px;align-items:end;gap:6px;margin:8px 0}
.line .x{font-family:var(--cond);font-size:26px;color:var(--muted);padding-bottom:54px}
.num label{display:block;font-size:12px;color:var(--muted);text-align:center;margin-bottom:2px}
.num input{width:100%;min-height:56px;text-align:center;font-family:var(--cond);font-weight:700;font-size:30px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);padding:0 2px;font-variant-numeric:tabular-nums}
.step{display:flex;gap:4px;margin-top:4px}
.step button{flex:1;min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:18px;line-height:1}
.rm{min-height:56px;border:0;background:none;color:var(--muted);font-size:22px;margin-bottom:40px}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sum b{font-family:var(--cond);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.up{color:var(--green)} .down{color:var(--red)}

/* lists */
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.big{font-family:var(--cond);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

/* segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--onblue)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart .cap{min-height:22px;font-size:14px;margin-top:4px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--muted)}

/* sheet / modal */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .grp{font-family:var(--cond);font-weight:600;font-size:17px;margin:14px 0 4px;color:var(--muted)}
.pick{display:block;width:100%;text-align:left;min-height:48px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none}

/* timer */
.timer{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:6px;align-items:center}
.timer .fab{min-height:52px;min-width:52px;border-radius:26px;border:0;background:var(--ink);color:var(--bg);font-family:var(--cond);font-weight:700;font-size:22px;padding:0 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.timer .opt{min-height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;border:1.5px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,var(--surface))}
.banner.now{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--surface))}
.banner b{font-family:var(--cond);font-size:20px;font-weight:600}
.tag.dl{border-color:var(--green);color:var(--green)}
.restb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:20px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px}
.chk input{width:22px;height:22px;accent-color:var(--blue)}
.cline{padding:8px 0}
.cline+.cline{border-top:1px dashed var(--line)}
.cl1{display:grid;grid-template-columns:1fr auto 2.1fr 36px;align-items:end;gap:6px}
.cl1 .x{font-family:var(--cond);font-size:26px;color:var(--muted);padding-bottom:54px}
.cl2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 42px 0 0}
.dur{display:flex;align-items:center;gap:2px}
.dur span{font-family:var(--cond);font-size:26px;font-weight:700;color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(24px);opacity:.6}} }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" aria-label="Navigation"><div class="in" id="tabs"></div></nav>
<div id="timer" class="timer"></div>
<div id="overlay"></div>
<script>
(function(){
"use strict";
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };
const f1 = n => (Math.round(n*10)/10).toLocaleString("fr-FR");
const f0 = n => Math.round(n).toLocaleString("fr-FR");
const weekKey = iso => { const d=new Date(iso+"T12:00:00"); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d.toISOString().slice(0,10); };
const PLATE = ["var(--blue)","var(--red)","var(--yellow)","var(--green)"];
const LS_KEY = "carnet-salle-v1", LS_PEND = "carnet-salle-pending";

/* ---------- rest & deload helpers ---------- */
function parseRest(v){ v=String(v||"").trim(); if(!v) return 0; const m=v.match(/^(\d+)\s*[:m']\s*(\d{0,2})/); if(m) return (+m[1])*60+(+m[2]||0); const n=num(v); return n>0? Math.round(n):0; }
const fmtRest = s => s? `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}` : "";
const addDays = (iso,n) => { const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
function deloadCfg(){ const c=S.catalog; if(!c.deload) c.deload={enabled:false,every:6,start:weekKey(todayISO())}; return c.deload; }
function cyclePos(iso){ const d=deloadCfg(); const w=Math.round((new Date(weekKey(iso)+"T12:00:00")-new Date(weekKey(d.start)+"T12:00:00"))/(7*864e5)); const e=Math.max(2,+d.every||6); return ((w%e)+e)%e+1; }
function isDeloadDate(iso){ const d=deloadCfg(); return !!d.enabled && cyclePos(iso)===Math.max(2,+d.every||6); }
function nextDeloadWeek(){ const d=deloadCfg(); const e=Math.max(2,+d.every||6); const pos=cyclePos(todayISO()); return addDays(weekKey(todayISO()), 7*(e-pos)); }
function deloadBanner(){
  const d=deloadCfg(); if(!d.enabled) return "";
  const e=Math.max(2,+d.every||6), pos=cyclePos(todayISO());
  if(pos===e) return `<div class="banner now" role="status"><b>Semaine de deload</b><p class="small">Semaine ${e}/${e} du cycle. Les exercices ajoutés sont pré-remplis avec moitié moins de séries, aux mêmes charges. Ces séances sont exclues des courbes par défaut.</p></div>`;
  if(pos===e-1) return `<div class="banner" role="status"><b>Deload la semaine prochaine</b><p class="small">À partir du ${esc(fmtDate(nextDeloadWeek()))}. Semaine ${pos}/${e} du cycle.</p></div>`;
  return `<p class="small muted">Semaine ${pos}/${e} du cycle · deload le ${esc(fmtShort(nextDeloadWeek()))}</p>`;
}

/* ---------- state ---------- */
function seedCatalog(){
  const th=[{id:"th_haut",name:"Haut du corps"},{id:"th_bas",name:"Bas du corps"}];
  const bl=[
    {id:"b_pec",name:"Pectoraux",themeId:"th_haut"},{id:"b_dos",name:"Dos",themeId:"th_haut"},
    {id:"b_epa",name:"Épaules",themeId:"th_haut"},{id:"b_bra",name:"Bras",themeId:"th_haut"},
    {id:"b_qua",name:"Quadriceps",themeId:"th_bas"},{id:"b_isc",name:"Ischios et fessiers",themeId:"th_bas"}];
  const ex=[["Développé couché","b_pec"],["Écarté à la poulie","b_pec"],["Tirage vertical","b_dos"],["Rowing haltère","b_dos"],
    ["Développé militaire","b_epa"],["Élévations latérales","b_epa"],["Curl biceps","b_bra"],["Extension triceps poulie","b_bra"],
    ["Squat","b_qua"],["Presse à cuisses","b_qua"],["Soulevé de terre roumain","b_isc"],["Hip thrust","b_isc"]]
    .map(([n,b],i)=>({id:"e"+i,name:n,blocId:b}));
  return {themes:th,blocs:bl,exercises:ex,updatedAt:0};
}
let S = loadLocal();
let pending = new Set(loadPending());
function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw); if(s&&s.catalog) return s; } }catch(e){}
  return {catalog:seedCatalog(), body:{entries:[],updatedAt:0}, sessions:{}, activeId:null};
}
function loadPending(){ try{ return JSON.parse(localStorage.getItem(LS_PEND)||"[]"); }catch(e){ return []; } }
function persistLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); localStorage.setItem(LS_PEND, JSON.stringify([...pending])); }catch(e){}
}
const cat = () => S.catalog;
const exById = id => cat().exercises.find(e=>e.id===id);
const blocById = id => cat().blocs.find(b=>b.id===id);
const themeById = id => cat().themes.find(t=>t.id===id);
const liveSessions = () => Object.values(S.sessions).filter(s=>!s.deleted).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
function blocColor(blocId){ const i = cat().blocs.findIndex(b=>b.id===blocId); return PLATE[(i<0?0:i)%4]; }

/* ---------- sync (claude db) ---------- */
let db=null, col=null, syncState="local", flushTimer=null, flushing=false;
function docFor(key){
  if(key==="catalog") return S.catalog;
  if(key==="body") return S.body;
  if(key.startsWith("s_")) return S.sessions[key.slice(2)];
  return null;
}
function markDirty(key){ pending.add(key); persistLocal(); scheduleFlush(); }
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer=setTimeout(flush, 1200); }
async function flush(){
  if(!db||!col||flushing) return;
  flushing=true;
  try{
    for(const key of [...pending]){
      const d = docFor(key); if(!d){ pending.delete(key); continue; }
      try{ await db.collection(col).doc(key).set(JSON.parse(JSON.stringify(d))); pending.delete(key); }
      catch(e){ if(e&&e.code==="unavailable"){ break; } if(e&&(e.code==="quota_exceeded")) toast("Stockage en ligne plein : exporte une sauvegarde."); if(e&&["revoked","not_granted","capability_disabled"].includes(e.code)){ db=null; syncState="local"; break; } pending.delete(key); }
    }
  } finally { flushing=false; persistLocal(); if(syncState!=="local") syncState = pending.size? "pending":"ok"; renderStatus(); }
}
async function initSync(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!d||!u) return;
    const id = await u.id(); if(!id) return;
    db=d; col="data/users/"+id;
    const snap = await db.collection(col).get();
    const seen = new Set();
    for(const doc of snap.docs){
      const key=doc.id, data=JSON.parse(JSON.stringify(doc.data()||{})); seen.add(key);
      const local=docFor(key); const rt=data.updatedAt||0, lt=(local&&local.updatedAt)||0;
      if(!local || rt>lt){
        if(key==="catalog") S.catalog=data; else if(key==="body") S.body=data;
        else if(key.startsWith("s_")) S.sessions[key.slice(2)]=data;
        pending.delete(key);
      } else if(lt>rt) pending.add(key);
    }
    if(S.catalog.updatedAt && !seen.has("catalog")) pending.add("catalog");
    if(S.body.updatedAt && !seen.has("body")) pending.add("body");
    for(const sid in S.sessions) if(!seen.has("s_"+sid)) pending.add("s_"+sid);
    if(S.activeId && (!S.sessions[S.activeId]||S.sessions[S.activeId].deleted)) S.activeId=null;
    syncState = pending.size? "pending":"ok";
    persistLocal(); render(); flush();
    window.addEventListener("online", flush);
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flush(); });
  }catch(e){ syncState="local"; renderStatus(); return "error"; }
}
function renderStatus(){
  const el=$("#sync"); if(!el) return;
  const m = {ok:["ok","Synchronisé avec ton compte"],pending:["warn","Enregistré, synchronisation en cours"],local:["","Enregistré sur cet appareil"]}[syncState];
  el.innerHTML=`<span class="dot ${m[0]}"></span>${m[1]}`;
}

/* ---------- save helpers ---------- */
function saveCatalog(){ S.catalog.updatedAt=Date.now(); markDirty("catalog"); }
function saveBody(){ S.body.updatedAt=Date.now(); markDirty("body"); }
function saveSession(s){ s.updatedAt=Date.now(); markDirty("s_"+s.id); }

/* ---------- metrics ---------- */
function lineStats(lines){
  let sets=0,reps=0,vol=0,e1rm=0,e1rmReps=0,maxKg=0;
  for(const l of lines||[]){
    const s=num(l.sets), r=num(l.reps), k=num(l.kg);
    if(s<=0||r<=0) continue;
    sets+=s; reps+=s*r; vol+=s*r*k; if(k>maxKg) maxKg=k;
    if(k>0){ const e=k*(1+r/30); if(e>e1rm){ e1rm=e; e1rmReps=r; } }
  }
  return {sets,reps,vol,avgKg:reps?vol/reps:0,avgReps:sets?reps/sets:0,volPerSet:sets?vol/sets:0,e1rm,e1rmReps,maxKg};
}
const METRICS = {
  volPerSet:{label:"Volume moyen par série",unit:"kg", help:"Charge moyenne pondérée × répétitions moyennes par série. Ne dépend pas du nombre de séries."},
  vol:{label:"Volume total (tonnage)",unit:"kg", help:"Somme séries × reps × charge. Augmente aussi si tu ajoutes des séries."},
  avgKg:{label:"Charge moyenne pondérée",unit:"kg", help:"Chaque kilo compte autant de fois qu'il a été soulevé : les séries longues pèsent plus."},
  avgReps:{label:"Répétitions moyennes par série",unit:"reps", help:"Total des répétitions ÷ nombre de séries."},
  e1rm:{label:"Force max estimée (1RM)",unit:"kg", help:"Formule d'Epley sur ta meilleure série. Peu fiable au-delà d'environ 12 répétitions."},
  reps:{label:"Répétitions totales",unit:"reps", help:"Utile pour les exercices au poids du corps."}
};
const isCardio = ex => !!(ex && ex.kind==="cardio");
const isCardioLines = lines => !!(lines&&lines[0]&&(lines[0].dur!==undefined||lines[0].dist!==undefined));
const isDistLines = lines => !!(lines&&lines[0]&&lines[0].dist!==undefined);
const isDistEx = ex => isCardio(ex) && ex.measure==="distance";
const fmtM = m => m>=10000 ? f1(m/1000)+" km" : f0(m)+" m";
const fmtDur = s => { s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h? `${h}h${String(m).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
function cardioStats(lines){
  let sets=0,t=0,ts=0,sp=0,ti=0,inc=0,dist=0,gain=0,dm=0,dSets=0,pt=0,pm=0;
  for(const l of lines||[]){
    const s=num(l.sets), d=num(l.dur), v=num(l.speed), g=num(l.incl), m=num(l.dist);
    if(s<=0||(d<=0&&m<=0)) continue;
    sets+=s; const tt=s*Math.max(d,0); t+=tt;
    if(m>0){ dm+=s*m; dSets+=s; dist+=s*m/1000; if(d>0){ pt+=tt; pm+=s*m; } }
    else if(v>0&&d>0){ ts+=tt; sp+=tt*v; const km=tt/3600*v; dist+=km; if(g>0) gain+=km*1000*g/100; }
    if(d>0&&l.incl!==""&&l.incl!=null&&isFinite(parseFloat(l.incl))){ ti+=tt; inc+=tt*g; }
  }

/* ---------- chart ---------- */
function chartSVG(pts, opt={}){
  if(!pts.length) return `<div class="empty">Pas encore de données.</div>`;
  const W=360,H=210,L=44,R=12,T=14,B=28;
  const ys=pts.map(p=>p.y); let lo=Math.min(...ys,opt.base??Infinity), hi=Math.max(...ys,opt.base??-Infinity);
  if(lo===hi){ lo=lo*0.9; hi=hi*1.1||1; } const pad=(hi-lo)*0.12; lo-=pad; hi+=pad; if(lo<0&&Math.min(...ys)>=0) lo=0;
  const X=i=> pts.length===1? (L+W-R)/2 : L+(W-L-R)*i/(pts.length-1);
  const Y=v=> T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let k=0;k<=3;k++){ const v=lo+(hi-lo)*k/3, y=Y(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${esc(opt.fmt?opt.fmt(v):(hi-lo)<10?f1(v):f0(v))}</text>`; }
  if(opt.base!=null){ const y=Y(opt.base); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-dasharray="4 4"/>`; }
  const step=Math.max(1,Math.ceil(pts.length/5));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.label)}</text>`; });
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const color=opt.color||"var(--blue)";
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="5" ${p.deload?`fill="var(--surface)" stroke="${color}" stroke-width="2"`:`fill="${color}"`}/><circle data-act="pt" data-i="${i}" cx="${X(i)}" cy="${Y(p.y)}" r="16" fill="transparent"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||"Courbe")}">${g}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

function progCardio(done){
  const h=exerciseHistory(UI.progEx,UI.showDeload); const ex=exById(UI.progEx);
  const any=f=>h.some(f);
  const ok={time:any(x=>x.st.timeSec>0),dist:any(x=>x.st.dist>0),setDist:any(x=>x.st.setDist>0),pace:any(x=>x.st.hasPace),speed:any(x=>x.st.hasSpeed),incl:any(x=>x.st.hasIncl),gain:any(x=>x.st.gain>0)};
  const avail=Object.keys(CMETRICS).filter(k=>ok[k]);
  let mk=UI.progCMetric; if(!avail.includes(mk)) mk = isDistEx(ex)&&ok.dist ? "dist" : ok.dist ? "dist" : "time";
  const M=CMETRICS[mk]; const isP=mk==="pace";
  const pts=h.filter(x=> mk==="pace"? x.st.hasPace : true);
  chartPts=pts.map(x=>({label:fmtShort(x.date),y:x.st[mk],lines:x.lines,deload:x.deload})); chartUnit=M.unit;
  if(!pts.length) return `<div class="empty">Pas de données pour cette mesure.</div>`;
  const first=pts[0].st[mk], lastv=pts[pts.length-1].st[mk]; const p = first? (lastv-first)/first*100 : 0;
  const good = M.lower ? p<=0 : p>=0;
  const shown = isP ? fmtDur(lastv) : f1(lastv);
  return `<label class="f" for="pe">Exercice</label><select class="i" id="pe" data-act="progEx">${groupedExOptions(done,UI.progEx)}</select>
    <label class="f" for="pcm">Mesure</label><select class="i" id="pcm" data-act="progCMetric">${avail.map(k=>`<option value="${k}" ${k===mk?"selected":""}>${CMETRICS[k].label}</option>`).join("")}</select>
    <div class="card chart"><div class="big">${shown} <span style="font-size:20px">${esc(chartUnit)}</span></div>
      <div class="small ${good?"up":"down"}">${pts.length>1?`${p>=0?"+":""}${f1(p)} % depuis le ${esc(fmtShort(pts[0].date))}${M.lower?" (baisse = progrès)":""}`:"Première séance"}</div>
      ${chartSVG(chartPts,{color:"var(--red)",title:M.label,fmt:isP?fmtDur:null})}<div class="cap muted" id="cap">Touche un point pour voir le détail.</div>
      <p class="small muted">${esc(M.help)}</p>
      ${isDistEx(ex)&&!ok.pace?`<p class="small muted">Sans le temps, tu vois si tu rames plus longtemps, pas si tu vas plus vite. Active « saisir aussi le temps » dans la fiche de l'exercice pour suivre l'allure.</p>`:""}</div>
    <h2>Détail par séance</h2><div class="card scroll"><table class="t"><thead><tr><th>Date</th><th>Séries</th>${ok.time?"<th>Temps</th>":""}${ok.dist?"<th>Distance</th>":""}${ok.pace?"<th>Allure</th>":""}${ok.speed?"<th>Vitesse</th>":""}${ok.incl?"<th>Incl.</th>":""}</tr></thead><tbody>
    ${h.slice().reverse().map(x=>`<tr><td>${esc(fmtShort(x.date))}${x.deload?' <span class="tag dl">deload</span>':""}</td><td>${f0(x.st.sets)}</td>${ok.time?`<td>${x.st.timeSec?fmtDur(x.st.timeSec):"—"}</td>`:""}${ok.dist?`<td>${x.st.dist?fmtM(x.st.distM):"—"}</td>`:""}${ok.pace?`<td>${x.st.hasPace?fmtDur(x.st.pace):"—"}</td>`:""}${ok.speed?`<td>${x.st.hasSpeed?f1(x.st.speed)+" km/h":"—"}</td>`:""}${ok.incl?`<td>${x.st.hasIncl?f1(x.st.incl)+" %":"—"}</td>`:""}</tr>`).join("")}
    </tbody></table></div>`;
}
function groupedExOptions(list, sel){
  const groups={}; for(const e of list){ const b=blocById(e.blocId); (groups[b?b.name:"Sans bloc"] ||= []).push(e); }
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b,"fr")).map(g=>`<optgroup label="${esc(g)}">${groups[g].map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.name)}</option>`).join("")}</optgroup>`).join("");
}
function groupExercises(key){
  const [kind,id]=key.split(":");
  const blocIds = kind==="t" ? cat().blocs.filter(b=>b.themeId===id).map(b=>b.id) : [id];
  return cat().exercises.filter(e=>blocIds.includes(e.blocId));
}
function progGrp(){
  const opts=[...cat().themes.map(t=>({k:"t:"+t.id,l:"Thème · "+t.name})),...cat().blocs.map(b=>({k:"b:"+b.id,l:"Bloc · "+b.name}))];
  if(!opts.length) return `<div class="empty">Crée un thème ou un bloc dans l'onglet Exercices.</div>`;
  if(!UI.progGroup||!opts.find(o=>o.k===UI.progGroup)) UI.progGroup=opts[0].k;
  const exs=groupExercises(UI.progGroup);
  const allC = exs.length>0 && exs.every(isCardio);
  const mk = allC ? UI.groupCMetric : UI.groupMetric;
  // weekly index: each exercise normalised to its first recorded value (=100), then averaged
  const weeks={}; let used=0; const dlW=new Set();
  for(const e of exs){
    const h=exerciseHistory(e.id,UI.showDeload); if(!h.length) continue;
    const useK = isCardio(e) ? (allC ? mk : (h.some(x=>x.st.dist>0)?"dist":"time")) : isBodyweight(e.id) ? (mk==="avgReps"?"avgReps":"reps") : mk;
    const hh=h.filter(x=>x.st[useK]>0); if(!hh.length) continue; const b0=hh.find(x=>!x.deload)||hh[0]; const base=b0.st[useK]; if(!base) continue; used++; const inv=useK==="pace";
    const perW={}; for(const x of hh){ (perW[weekKey(x.date)] ||= []).push(inv? base/x.st[useK]*100 : x.st[useK]/base*100); if(x.deload) dlW.add(weekKey(x.date)); }
    for(const w in perW){ const arr=perW[w]; (weeks[w] ||= []).push(arr.reduce((a,b)=>a+b,0)/arr.length); }
  }
  const wk=Object.keys(weeks).sort();
  chartPts=wk.map(w=>({label:fmtShort(w),y:weeks[w].reduce((a,b)=>a+b,0)/weeks[w].length,n:weeks[w].length,week:w,deload:dlW.has(w)})); chartUnit="indice";
  const lastv=chartPts.length?chartPts[chartPts.length-1].y:0;
  const mopts= allC ? Object.keys(CMETRICS).map(k=>`<option value="${k}" ${k===mk?"selected":""}>${CMETRICS[k].label}</option>`).join("")
    : ["volPerSet","vol","avgKg","avgReps","e1rm"].map(k=>`<option value="${k}" ${k===mk?"selected":""}>${METRICS[k].label}</option>`).join("");
  const mixNote = !allC && exs.some(isCardio) ? " Les exercices cardio de ce groupe sont suivis en distance (ou en temps sans vitesse)." : "";
  return `<label class="f" for="pg">Thème ou bloc</label><select class="i" id="pg" data-act="progGroup">${opts.map(o=>`<option value="${o.k}" ${o.k===UI.progGroup?"selected":""}>${esc(o.l)}</option>`).join("")}</select>
    <label class="f" for="pgm">Mesure de base</label><select class="i" id="pgm" data-act="${allC?"groupCMetric":"groupMetric"}">${mopts}</select>
    <div class="card chart">${chartPts.length?`<div class="big">${f0(lastv)} <span style="font-size:20px">/ 100</span></div><div class="small ${lastv>=100?"up":"down"}">${lastv>=100?"+":""}${f1(lastv-100)} % par rapport à tes débuts</div>`:""}
      ${chartSVG(chartPts,{base:100,color:"var(--green)",title:"Indice de progression"})}<div class="cap muted" id="cap">Touche un point pour voir le détail.</div>
      <p class="small muted">Chaque exercice démarre à 100 lors de sa première séance, puis on fait la moyenne par semaine des exercices travaillés. Ça évite qu'un exercice lourd (squat) écrase un exercice léger (élévations). ${used} exercice${used>1?"s":""} pris en compte.${mixNote}</p></div>`;
}

const BODY_F=[["weight","Poids","kg"],["height","Taille","cm"],["fat","Masse grasse","%"],["waist","Tour de taille","cm"],["hips","Tour de hanches","cm"],["chest","Tour de poitrine","cm"],["arm","Tour de bras","cm"],["thigh","Tour de cuisse","cm"],["calf","Tour de mollet","cm"]];
function lastHeight(){ const e=S.body.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).find(x=>num(x.height)>0); return e?num(e.height):0; }
function viewCorps(){
  const E=S.body.entries.slice().sort((a,b)=>a.date.localeCompare(b.date));

    <div class="card chart">${chartSVG(series,{color:"var(--red)",title:"Évolution"})}<div class="cap muted" id="cap"></div></div>
    <h2>Relevés</h2><ul class="list card">${E.slice().reverse().map(e=>`<li><div style="flex:1"><div style="font-weight:600">${esc(fmtDate(e.date))}</div><div class="small muted">${BODY_F.filter(f=>num(e[f[0]])>0).map(f=>`${f[1]} ${f1(num(e[f[0]]))} ${f[2]}`).map(esc).join(" · ")}</div></div><button class="btn ghost" data-act="editBody" data-id="${e.id}">Modifier</button></li>`).join("")}</ul>`

/* ---------- text export ---------- */
function lineToText(l){
  const s=num(l.sets);
  if(l.dist!==undefined) return `${s} x ${f0(num(l.dist))} m${num(l.dur)?" en "+fmtDur(num(l.dur)):""}`;
  if(l.dur!==undefined){ const parts=[]; if(num(l.speed)) parts.push(f1(num(l.speed))+" km/h"); if(l.incl!==""&&l.incl!=null&&isFinite(parseFloat(l.incl))) parts.push(f1(num(l.incl))+" %");
    return `${s} x ${fmtDur(num(l.dur))}${parts.length?" à "+parts.join(", "):""}`; }
  return `${s} x ${f0(num(l.reps))}${num(l.kg)?" à "+f1(num(l.kg))+" kg":""}`;
}
const validLine = l => num(l.sets)>0 && (l.dist!==undefined? num(l.dist)>0 : l.dur!==undefined? num(l.dur)>0 : num(l.reps)>0);
const hasContent = s => (s.items||[]).some(it=>(it.lines||[]).some(validLine));
function exportWeeks(n){
  // Remonte semaine par semaine depuis la semaine en cours ; les semaines de deload sont sautées et ne comptent pas.
  const all=liveSessions().filter(hasContent); const cur=weekKey(todayISO());
  const weeks=[], skipped=[];
  for(let k=0; weeks.length<n && k<104; k++){
    const wk=addDays(cur,-7*k), end=addDays(wk,6);
    const ss=all.filter(s=>s.date>=wk&&s.date<=end);
    const deload = ss.length ? ss.every(s=>s.deload) : isDeloadDate(wk);
    if(deload){ skipped.push(wk); continue; }
    weeks.push({wk,end,ss:ss.filter(s=>!s.deload).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0))});
  }
  return {weeks:weeks.reverse(), skipped:skipped.reverse()};
}
function buildTextExport(n){
  const {weeks}=exportWeeks(n); const out=[];
  weeks.forEach((w,i)=>{
    out.push(`Semaine ${i+1}`); out.push("");
    if(!w.ss.length){ out.push("Aucune séance"); out.push(""); return; }
    const perDay={};
    for(const s of w.ss){
      const day=new Date(s.date+"T12:00:00").toLocaleDateString("fr-FR",{weekday:"long"});
      perDay[s.date]=(perDay[s.date]||0)+1;
      let title=day.charAt(0).toUpperCase()+day.slice(1);
      if(perDay[s.date]>1) title+=` (séance ${perDay[s.date]})`;
      out.push(title);
      for(const it of s.items||[]){
        const lines=(it.lines||[]).filter(validLine); if(!lines.length) continue;
        out.push((exById(it.exId)||{name:"Exercice supprimé"}).name);
        for(const l of lines) out.push(lineToText(l));
        out.push("");
      }
    }
  });
  while(out.length&&out[out.length-1]==="") out.pop();
  return out.join("\n");
}
function openTextExport(){
  const n=UI.txtN||1; const txt=buildTextExport(n); const {weeks,skipped}=exportWeeks(n);
  const rng=weeks.map((w,i)=>`S${i+1} : ${fmtShort(w.wk)} – ${fmtShort(w.end)}`).join(" · ");
  openSheet(`<div class="row"><h3 style="flex:1">Exporter en texte</h3><button class="btn ghost" data-act="closeSheet">Fermer</button></div>
    <div class="seg" role="group" aria-label="Période">${[1,2,3,4].map(k=>`<button data-act="txtN" data-n="${k}" aria-pressed="${k===n}" aria-label="${k} semaine${k>1?"s":""}">${k} sem.</button>`).join("")}</div>
    <p class="small muted">Semaines du lundi au dimanche, semaine en cours incluse. ${esc(rng)}${skipped.length?`<br>Semaine${skipped.length>1?"s":""} de deload sautée${skipped.length>1?"s":""} : ${esc(skipped.map(fmtShort).join(", "))}`:""}</p>

function doImport(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result); if(d.app!=="carnet-salle"||!d.catalog) throw 0;
    confirmSheet("Importer cette sauvegarde ? Les séances seront fusionnées, le catalogue et les mesures remplacés.","Importer",()=>{
      S.catalog=d.catalog; S.catalog.updatedAt=Date.now(); S.body=d.body||{entries:[]}; S.body.updatedAt=Date.now();
      for(const s of d.sessions||[]){ s.updatedAt=Date.now(); S.sessions[s.id]=s; pending.add("s_"+s.id); }
      pending.add("catalog"); pending.add("body"); persistLocal(); scheduleFlush(); render(); toast("Sauvegarde importée"); });
  }catch(e){ toast("Fichier non reconnu : choisis un export de Carnet de salle."); } };
  r.readAsText(file);
}

/* ---------- migrations ---------- */
function ensureCardioV2(){
  const c=cat(); if(c.cardioV2) return;
  for(const e of c.exercises){ const n=e.name.toLowerCase(); if(isCardio(e)&&(n==="rameur"||n==="ski erg")){ e.measure="distance"; e.useSpeed=false; e.useIncline=false; } }
  c.cardioV2=true; saveCatalog(); render();
}
function ensureCardio(){
  const c=cat(); if(c.cardioV1) return;
  let th=c.themes.find(t=>t.name.toLowerCase()==="cardio"); if(!th){ th={id:"th_cardio",name:"Cardio"}; c.themes.push(th); }
  const bloc=(id,name)=>{ let b=c.blocs.find(x=>x.name.toLowerCase()===name.toLowerCase()); if(!b){ b={id,name,themeId:th.id}; c.blocs.push(b); } return b; };
  const b1=bloc("b_cmarche","Marche et course"), b2=bloc("b_cmach","Machines cardio");
  const list=[["Marche inclinée",b1,1,1],["Marche rapide",b1,1,1],["Course",b1,1,1],["Sprint",b1,1,1],["Vélo",b2,1,0],["Ski erg",b2,0,0],["Rameur",b2,0,0]];
  for(const [n,b,sp,inc] of list){ if(!c.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase())) c.exercises.push({id:uid(),name:n,blocId:b.id,kind:"cardio",useSpeed:!!sp,useIncline:!!inc}); }
  c.cardioV1=true; saveCatalog(); render();
}

/* ---------- boot ---------- */
if(S.activeId && !S.sessions[S.activeId]) S.activeId=null;
render();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")) navigator.serviceWorker.register("sw.js").catch(()=>{});
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
initSync().then(r=>{ if(r!=="error"){ ensureCardio(); ensureCardioV2(); } });
})();
</script>
